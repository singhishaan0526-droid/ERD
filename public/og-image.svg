<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a14" />
      <stop offset="100%" stop-color="#142816" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Glowing Accents -->
  <circle cx="200" cy="180" r="160" fill="rgba(0, 229, 153, 0.12)" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="180" fill="rgba(76, 175, 80, 0.14)" filter="blur(70px)" />

  <!-- Brand Pill -->
  <rect x="100" y="90" width="310" height="42" rx="21" fill="rgba(0, 229, 153, 0.15)" stroke="url(#brandGrad)" stroke-width="1.5" />
  <text x="125" y="117" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#00e599">
    Academic DBMS &amp; Chen Notation
  </text>

  <!-- Main Headline -->
  <text x="100" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    ER Diagram Maker
  </text>

  <text x="100" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#brandGrad)" letter-spacing="-0.5">
    Visual Modeling, SQL to ERD &amp; AI Generator
  </text>

  <text x="100" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Create clean Chen notation entity-relationship diagrams in seconds.
  </text>
  <text x="100" y="375" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Auto-generate from English, convert SQL schemas, and save with Neon.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 440)">
    <rect x="0" y="0" width="220" height="48" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <text x="30" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Chen Notation
    </text>

    <rect x="240" y="0" width="220" height="48" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <text x="270" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      SQL Bi-Directional
    </text>

    <rect x="480" y="0" width="220" height="48" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <text x="510" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Neon Cloud Sync
    </text>
  </g>

  <!-- Visual ER Diagram Illustration on the Right -->
  <g transform="translate(780, 120)">
    <!-- Entity: Student -->
    <rect x="60" y="30" width="160" height="70" rx="6" fill="#1b3820" stroke="#00e599" stroke-width="3" />
    <text x="140" y="72" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
      Student
    </text>

    <!-- Attribute: StudentID (PK) -->
    <ellipse cx="20" cy="180" rx="65" ry="32" fill="#142816" stroke="#4caf50" stroke-width="2.5" />
    <text x="20" y="184" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" text-decoration="underline">
      StudentID
    </text>
    <line x1="80" y1="100" x2="35" y2="150" stroke="#00e599" stroke-width="2" />

    <!-- Relationship: Enrolls (1:N) -->
    <polygon points="140,170 200,215 140,260 80,215" fill="#142816" stroke="#00e599" stroke-width="2.5" />
    <text x="140" y="221" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#00e599" text-anchor="middle">
      Enrolls
    </text>
    <line x1="140" y1="100" x2="140" y2="170" stroke="#00e599" stroke-width="2" />
    <text x="155" y="130" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#86efac">1</text>

    <!-- Entity: Course -->
    <rect x="60" y="330" width="160" height="70" rx="6" fill="#1b3820" stroke="#00e599" stroke-width="3" />
    <text x="140" y="372" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
      Course
    </text>
    <line x1="140" y1="260" x2="140" y2="330" stroke="#00e599" stroke-width="2" />
    <text x="155" y="300" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#86efac">N</text>
  </g>
</svg>

